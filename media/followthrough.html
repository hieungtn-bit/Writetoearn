<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0e11}
  svg{display:block}
  text{font-family:"DejaVu Sans",system-ui,sans-serif;fill:#e8eaed}
  .kicker{font-size:19px;letter-spacing:3.5px;fill:#f0b90b;font-weight:700}
  .title{font-size:40px;font-weight:800;letter-spacing:-0.5px}
  .sub{font-size:17px;fill:#9aa3ad}
  .lab{font-size:17px;font-weight:800}
  .note{font-size:14px;fill:#8b949e}
  .lab.fail{fill:#c98500}
  .lab.ok{fill:#3987e5}
  .lab.muted{fill:#5a636d}
  .lab.ink{fill:#e8eaed}
  .budget{font-size:14px;fill:#6b757f}
  .stat{font-size:22px;font-weight:700}
  .statlab{font-size:15px;fill:#8b949e}
  .mark{font-size:17px;font-weight:700;fill:#f0b90b;letter-spacing:1px}
</style>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0b0e11"/>
  <rect x="0" y="0" width="1200" height="4" fill="#c98500"/>

  <text x="64" y="56" class="kicker">A PUBLISHED CHECK, ONE DAY LATER</text>
  <text x="1136" y="56" text-anchor="end" class="mark">MAIX8</text>

  <text x="64" y="118" class="title">The trigger fired 91 minutes</text>
  <text x="64" y="164" class="title">after I published the warning.</text>
  <text x="64" y="200" class="sub">ICP, 10 hours held · the plan's own entry, stop and targets, on the tape since publication</text>

  <rect x="158.2" y="360" width="341.8" height="24"
        fill="#39414b" fill-opacity="0.55"/>
  <rect x="270.0" y="360" width="230.0" height="24"
        fill="#c98500" fill-opacity="0.45"/>
  <text x="329.1" y="482" text-anchor="middle" class="budget">
    stop to entry is the risk budget · shaded, the 67% of it spent before the trade went anywhere
  </text>

  <line x1="96" x2="1106" y1="372" y2="372" stroke="#39414b" stroke-width="1"/>
  
  <line x1="158.2" x2="158.2" y1="350" y2="394" stroke="#c98500" stroke-width="3"/>
  <text x="158.2" y="420" text-anchor="middle" class="lab fail">stop</text>
  <text x="158.2" y="442" text-anchor="middle" class="note">$2.390</text>
  <line x1="270.0" x2="270.0" y1="350" y2="394" stroke="#c98500" stroke-width="3"/>
  <text x="270.0" y="332" text-anchor="middle" class="lab fail">worst</text>
  <text x="270.0" y="310" text-anchor="middle" class="note">-0.67R</text>
  <line x1="500.0" x2="500.0" y1="350" y2="394" stroke="#e8eaed" stroke-width="3"/>
  <text x="500.0" y="420" text-anchor="middle" class="lab ink">entry</text>
  <text x="500.0" y="442" text-anchor="middle" class="note">$2.500</text>
  <line x1="568.4" x2="568.4" y1="350" y2="394" stroke="#3987e5" stroke-width="3"/>
  <text x="568.4" y="332" text-anchor="middle" class="lab ok">now</text>
  <text x="568.4" y="310" text-anchor="middle" class="note">+0.20R</text>
  <line x1="695.8" x2="695.8" y1="350" y2="394" stroke="#3987e5" stroke-width="3"/>
  <text x="695.8" y="420" text-anchor="middle" class="lab ok">best</text>
  <text x="695.8" y="442" text-anchor="middle" class="note">+0.57R</text>
  <line x1="1043.8" x2="1043.8" y1="350" y2="394" stroke="#5a636d" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1043.8" y="332" text-anchor="middle" class="lab muted">first target</text>
  <text x="1043.8" y="310" text-anchor="middle" class="note">never reached</text>

  <line x1="64" x2="1136" y1="546" y2="546" stroke="#252a31" stroke-width="1"/>
  <text x="64" y="582" class="stat">0.33R</text>
  <text x="64" y="604" class="statlab">Room left when it turned</text>

  <text x="440" y="582" class="stat">29.7%</text>
  <text x="440" y="604" class="statlab">Of ICP days take this stop from the open</text>

  <text x="1136" y="582" text-anchor="end" class="stat">-0.38%</text>
  <text x="1136" y="604" text-anchor="end" class="statlab">Against BTC since the fill</text>
</svg>
