<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0e11}

  .val{font-size:22px;font-weight:800}

  .stat{font-size:22px;font-weight:700}
