<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0e11}
  svg{display:block}

<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">

  <rect x="680" y="340" width="200" height="130" rx="3" fill="#c98500"/>
  <text x="780" y="504" text-anchor="middle" class="val" fill="#c98500">-16.72%</text>

  <text x="64" y="582" class="stat">16.7 pts</text>
  <text x="64" y="604" class="statlab">How right the officer was</text>

  <text x="600" y="582" class="stat">3.5–5.2%</text>
  <text x="600" y="604" class="statlab">Odds of a 2x in 90 days</text>

  <text x="1136" y="582" text-anchor="end" class="stat">10x</text>
