<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0b0e11}
  svg{display:block}
  text{font-family:"DejaVu Sans",system-ui,sans-serif;fill:#e8eaed}
  .kicker{font-size:19px;letter-spacing:3.5px;fill:#f0b90b;font-weight:700}
  .title{font-size:40px;font-weight:800;letter-spacing:-0.5px}
  .sub{font-size:17px;fill:#9aa3ad}
  .head{font-size:14px;fill:#8b949e;letter-spacing:1px}
  .sym{font-size:22px;font-weight:800}
  .cell{font-size:21px;font-weight:700}
  .miss{font-size:21px;font-weight:800;fill:#c98500}
  .ours{font-size:19px;font-weight:800;fill:#9aa3ad}
  .stat{font-size:22px;font-weight:700}
  .statlab{font-size:15px;fill:#8b949e}
  .mark{font-size:17px;font-weight:700;fill:#f0b90b;letter-spacing:1px}
</style>
<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#0b0e11"/>
  <rect x="0" y="0" width="1200" height="4" fill="#c98500"/>

  <text x="64" y="56" class="kicker">AUDITING A CALL THAT BEAT MINE</text>
  <text x="1136" y="56" text-anchor="end" class="mark">MAIX8</text>

  <text x="64" y="118" class="title">Their numbers were all short.</text>
  <text x="64" y="164" class="title">My whole book was stopped out.</text>
  <text x="64" y="200" class="sub">A forwarded bullish scan, checked against the tape · and what my own short board did on the same move</text>

  <text x="96" y="238" class="head">CLAIM</text>
  <text x="380" y="238" text-anchor="end" class="head">CLAIMED</text>
  <text x="660" y="238" text-anchor="end" class="head">ACTUAL</text>
  <text x="940" y="238" text-anchor="end" class="head">MISS</text>
  <line x1="64" x2="940" y1="250" y2="250" stroke="#252a31" stroke-width="1"/>

  
  <text x="96" y="268" class="sym">BTC</text>
  <text x="380" y="268" text-anchor="end" class="cell">$69.5k-69.8k</text>
  <text x="660" y="268" text-anchor="end" class="cell">$71,226</text>
  <text x="940" y="268" text-anchor="end" class="miss">+2.0%</text>
  <text x="96" y="330" class="sym">ETH</text>
  <text x="380" y="330" text-anchor="end" class="cell">17-18%</text>
  <text x="660" y="330" text-anchor="end" class="cell">+18.59%</text>
  <text x="940" y="330" text-anchor="end" class="miss">+0.6pp</text>
  <text x="96" y="392" class="sym">SOL</text>
  <text x="380" y="392" text-anchor="end" class="cell">11-12%</text>
  <text x="660" y="392" text-anchor="end" class="cell">+13.31%</text>
  <text x="940" y="392" text-anchor="end" class="miss">+1.3pp</text>

  <line x1="64" x2="940" y1="428" y2="428" stroke="#252a31" stroke-width="1"/>
  <text x="96" y="470" class="ours">Every miss is in the same direction — the market ran further than the call.</text>
  <text x="96" y="498" class="ours">My board, on that same move: 19 of 20 stopped, -19.4R.</text>

  <line x1="64" x2="1136" y1="546" y2="546" stroke="#252a31" stroke-width="1"/>
  <text x="64" y="582" class="stat">42.2%</text>
  <text x="64" y="604" class="statlab">Its entry trigger continues, over 3 days</text>

  <text x="560" y="582" class="stat">69.3%</text>
  <text x="560" y="604" class="statlab">Of the market rose — most of a bull read</text>

  <text x="1136" y="582" text-anchor="end" class="stat">0 of 3</text>
  <text x="1136" y="604" text-anchor="end" class="statlab">Numeric claims inside their range</text>
</svg>
